[versions]
agp = "8.11.1"
kotlin = "2.2.20"
compose = "1.8.2"
serialization = "1.9.0"
coroutines = "1.10.2"
activity = "1.10.1"
zxing = "3.5.3"
camerax = "1.4.2"
# androidx.compose.ui alineado con CMP 1.8.2 (ui-test-junit4 para Robolectric).
androidx-compose = "1.8.2"
robolectric = "4.14.1"
coreKtx = "1.16.0"
supabase = "3.2.4"
ktor = "3.3.0"
datetime = "0.7.1"
# Lucide icons (ISC) — ADR-0005 / V1.1 T2; wrapper KMP com.composables.
# Licencia registrada en docs/05-design-system/06-licencias-terceros.md.
lucide = "1.1.0"
# Ronda 2 (Área D): capturas de referencia. Roborazzi (Apache 2.0) sobre
# la suite Robolectric existente — ADR-0007. Compat: AGP 8.11, robolectric
# 4.14.1, Compose 1.8.2 (verificado por compilación en esta pasada).
roborazzi = "1.26.0"

[plugins]
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }

[libraries]
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version = "1.6.1" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version = "1.2.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.6.1" }
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
icons-lucide = { group = "com.composables", name = "icons-lucide", version.ref = "lucide" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-plugin = { group = "io.github.takahirom.roborazzi", name = "io.github.takahirom.roborazzi.gradle.plugin", version.ref = "roborazzi" }
