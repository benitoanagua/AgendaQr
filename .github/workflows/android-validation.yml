name: Android validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Supabase CI configuration
        # Unit tests never touch Supabase (verified: no commonTest references
        # SUPABASE_URL/KEY or AgendaQrSupabase), so missing secrets warn instead
        # of failing. A functional release build still needs real secrets.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase secrets missing; unit-test gate does not require them."
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Architecture and design-system gates
        run: ./gradlew verifyAgendaQrArchitecture --stacktrace

      - name: Domain unit tests
        run: ./gradlew :feature:destinations:domain:testDebugUnitTest --stacktrace

      - name: Upload domain test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-reports-${{ github.run_id }}
          path: |
            feature/destinations/domain/build/test-results/testDebugUnitTest/**
            feature/destinations/domain/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Data unit tests
        run: ./gradlew :feature:destinations:data:testDebugUnitTest --stacktrace

      - name: Presentation unit tests
        run: ./gradlew :feature:destinations:presentation:testDebugUnitTest --stacktrace

      - name: Upload presentation test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: presentation-test-reports-${{ github.run_id }}
          path: |
            feature/destinations/presentation/build/test-results/testDebugUnitTest/**
            feature/destinations/presentation/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Android unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Core UI unit tests
        run: ./gradlew :core:ui:testDebugUnitTest --stacktrace

      - name: Android debug assembly
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :androidApp:lint --stacktrace

      - name: Android release assembly
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Component lab WebAssembly
        run: ./gradlew componentLabWeb --stacktrace

  ios-compile:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kotlin iOS simulator compilation
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :feature:destinations:data:compileKotlinIosSimulatorArm64 :feature:destinations:presentation:compileKotlinIosSimulatorArm64 :core:ui:compileKotlinIosSimulatorArm64 --stacktrace

  supabase-acceptance:
    # Non-blocking until verified green: needs a live Postgres; RLS behavior
    # still requires `supabase start` or a hosted project (see harness header).
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update -y -q && sudo apt-get install -y -q postgresql-client

      - name: Run 006 FK acceptance harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run-acceptance.sh
